<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VS Code Iteration MCP</title>
  <desc id="desc">A ship-green and amber pair of connected workspace brackets surrounding a white protocol cube, followed by the Iteration MCP wordmark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#141b2e"/>
    </linearGradient>
    <linearGradient id="shipGreen" x1="70" y1="76" x2="218" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8be6b4"/>
      <stop offset="1" stop-color="#47c98e"/>
    </linearGradient>
    <linearGradient id="amber" x1="274" y1="76" x2="126" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc45b"/>
      <stop offset="1" stop-color="#f47a42"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="422" y1="0" x2="1124" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#d9e7ff"/>
      <stop offset="1" stop-color="#cdebd8"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="1188" height="348" rx="76" fill="url(#background)"/>
  <rect x="6.75" y="6.75" width="1186.5" height="346.5" rx="75.25" fill="none" stroke="#2d3850" stroke-width="1.5"/>

  <!-- Compact mark: the same silhouette can be cropped to a square icon. -->
  <g aria-label="Iteration bridge mark">
    <circle cx="125" cy="180" r="78" fill="#55d198" opacity="0.13" filter="url(#softGlow)"/>
    <circle cx="247" cy="180" r="78" fill="#f68a45" opacity="0.13" filter="url(#softGlow)"/>

    <!-- Paired workspace brackets. Their open centers read as an exchange/iteration loop. -->
    <path d="M146 72H102C79.9 72 62 89.9 62 112v136c0 22.1 17.9 40 40 40h44"
          fill="none" stroke="url(#shipGreen)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M226 72h44c22.1 0 40 17.9 40 40v136c0 22.1-17.9 40-40 40h-44"
          fill="none" stroke="url(#amber)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Connection ports stay legible while echoing MCP's tool graph. -->
    <path d="M101 180h42" stroke="#55d198" stroke-width="16" stroke-linecap="round"/>
    <circle cx="101" cy="180" r="15" fill="#55d198"/>
    <path d="M229 180h42" stroke="#f68a45" stroke-width="16" stroke-linecap="round"/>
    <circle cx="271" cy="180" r="15" fill="#f68a45"/>

    <!-- The three faces form the stable protocol core between debugger and terminal. -->
    <path d="m186 119 51 29-51 30-51-30 51-29Z" fill="#ffffff"/>
    <path d="m130 158 49 29v57l-31-18c-11.1-6.4-18-18.3-18-31.2V158Z" fill="#eef5ff"/>
    <path d="m242 158-49 29v57l31-18c11.1-6.4 18-18.3 18-31.2V158Z" fill="#dbe8ff"/>
  </g>

  <path d="M376 74v212" stroke="#334058" stroke-width="2"/>

  <!-- Live text keeps the lockup editable; Segoe UI is native to the extension's Windows target. -->
  <text x="426" y="211" fill="url(#wordmark)" font-family="Segoe UI Variable Display, Segoe UI, sans-serif"
        font-size="82" font-weight="720" letter-spacing="6">ITERATION</text>
  <text x="969" y="211" fill="#ff9b4b" font-family="Segoe UI Variable Display, Segoe UI, sans-serif"
        font-size="82" font-weight="760" letter-spacing="8">MCP</text>
</svg>
